# systemd-boot del live (UEFI). Sustituye a GRUB (bootmodes en
# profiledef.append.sh). Una sola entrada y sin menú: arranca directamente.
# Para ver el menú (y editar la línea de comandos con «e»), mantener pulsada
# la barra espaciadora al arrancar.
timeout 0
default 01-cachyos.conf
auto-entries no
auto-firmware no
beep no
