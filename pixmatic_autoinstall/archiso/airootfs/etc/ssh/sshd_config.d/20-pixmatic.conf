# Live de pixmatic: acceso por SSH como root o liveuser sin contraseña ni
# claves, para depurar instalaciones en VM. Ambas cuentas tienen la
# contraseña vacía en el live (airootfs/etc/shadow de upstream).
# ¡Cualquiera con acceso a la red del live entra como root!
#
# Las dos primeras ya las pone 10-archiso.conf de upstream (sshd se queda con
# el primer valor de cada opción); se repiten para no depender de él.
PermitRootLogin yes
PasswordAuthentication yes
PermitEmptyPasswords yes
